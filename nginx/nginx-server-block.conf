server {
    listen 8086;
    server_name https://160.250.246.219/;
    root /var/www/html;
    index index.html;

    access_log /var/log/nginx/https://160.250.246.219/.access.log;
    error_log /var/log/nginx/https://160.250.246.219/.error.log;

    location/{
    <ALLOW_DIRECTIVE>;
    try_files $uri $uri/ =404;
    }
}